[mypy]
python_version = 3.10
# Scope: the importable library. The stage entry points (generate/extract/score) and scripts pull
# heavy GPU-only deps (vllm, decord, qwen_vl_utils) that need not be installed to type-check the core.
files = mtla
ignore_missing_imports = True
# Annotations are the goal; don't force every local to be inferred perfectly.
check_untyped_defs = True
warn_unused_ignores = True
no_implicit_optional = True

# Third-party libraries without (usable) type stubs — treat as untyped.
[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-pycocotools.*]
ignore_missing_imports = True

[mypy-decord.*]
ignore_missing_imports = True

[mypy-qwen_vl_utils.*]
ignore_missing_imports = True

[mypy-moment_detr_eval.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True
