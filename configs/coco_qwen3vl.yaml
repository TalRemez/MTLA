# COCO detection with Qwen3-VL-8B  (single rollout).
# Reproduces: hallucination AUROC 0.902 (MTLA).
# Demonstrates COCO running on a second model: same dataset adapter, different model:.
model: qwen3vl
dataset: coco

paths:
  data: data/coco/coco_val_openvocab_80.json                  # open-vocab dataset json (scripts/prepare_coco.py)
  coco_gt: data/coco/annotations/instances_val2017.json       # COCO annotations (for mAP)
  predictions: runs/coco_qwen/predictions                     # seed{K}/predictions.json
  features: runs/coco_qwen/features                           # seed{K}/shard*.pt

n_rollouts: 1                                      # one knob: produce + vote over seeds 0..n-1

generate:
  gpus: null                                       # null = all visible GPUs
  temperature: 0.7

extract:
  gpus: null
  n_items: 5000

score:
  agg: max

band: [8, 21]
