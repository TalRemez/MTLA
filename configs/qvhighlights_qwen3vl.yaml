# QVHighlights temporal grounding with Qwen3-VL-8B.
# Reproduces: NMS-MTLA mAP 36.6, R@1@0.5 55.1, R@1@0.7 39.5 (SVAR baseline mAP 28.1).
model: qwen3vl
dataset: qvhighlights

paths:
  ann: /path/to/highlight_val_release.jsonl        # QVHighlights val annotations (jsonl)
  video_dir: /path/to/qvhighlights/videos          # {video_id}.mp4 clips
  predictions: runs/qvh/predictions
  features: runs/qvh/features                       # seed{K}/shard*.pt

generate:
  engine: hf                                        # Qwen3-VL video generation runs under HF
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  temperature: 0.0
  extra: {fps: 1.0, max_pixels_factor: 64}          # video sampling (QVH setting)

extract:
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]

score:
  n_rollouts: 16
  agg: max                                          # video: max-of-cluster fusion
  slot: first_digit                                 # REQUIRED: first timestamp-digit token

band: [8, 21]
