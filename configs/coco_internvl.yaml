# COCO detection with InternVL3.5-8B  (single rollout).
# Reproduces: hallucination AUROC 0.873 (MTLA); single-rollout mAP 36.2.
# For the 41.9 mAP headline with N=16 self-consistency voting, use coco_internvl_voting.yaml.
model: internvl
dataset: coco

paths:
  data: data/coco/coco_val_openvocab_80.json                  # open-vocab dataset json (scripts/prepare_coco.py)
  coco_gt: data/coco/annotations/instances_val2017.json       # COCO annotations (for mAP)
  predictions: runs/coco/predictions                          # seed{K}/predictions.json
  features: runs/coco/features                                # seed{K}/shard*.pt

n_rollouts: 1                                      # one knob: produce + vote over seeds 0..n-1

generate:
  gpus: null                                       # null = all visible GPUs (respects CUDA_VISIBLE_DEVICES)
  temperature: 0.7

extract:
  gpus: null
  n_items: 5000                                    # HF eager-attention pass

score:
  agg: max

band: [8, 21]                                      # middle-layer band (null = all layers)
