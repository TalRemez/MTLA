# COCO detection with InternVL3.5-8B.
# For the mAP headline: --n 16 (16 rollouts); score uses the support fusion (--agg support),
# scoring the coord-token inside-region signal (score.slot=digits, score.attn_scope=local).
model: internvl_image
dataset: coco

paths:
  data: data/coco/coco_val_openvocab_80.json                  # open-vocab dataset json (scripts/prepare_coco.py)
  coco_gt: data/coco/annotations/instances_val2017.json       # COCO annotations (for mAP)
  predictions: runs/coco/internvl_image/predictions           # rollout{K}/predictions.json
  features: runs/coco/internvl_image/features                 # rollout{K}/shard*.pt

generate:
  temperature: 0.7

score:
  agg: max
  slot: digits          # InternVL: coordinate tokens (paper coord_mean slot); MTLA headline
  attn_scope: local     # local = inside the proposal region (MTLA); global = SVAR baseline

band: [8, 21]                                      # middle-layer band (null = all layers)
