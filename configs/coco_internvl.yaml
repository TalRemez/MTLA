# COCO detection with InternVL3.5-8B — the second COCO model (Qwen3-VL is the headline; see
# configs/coco_qwen3vl.yaml). Same CocoDataset, different model:.
# Reproduces: hallucination AUROC 0.916 (MTLA), under the full 80-class open-vocab prompt.
model: internvl_image
dataset: coco

paths:
  data: data/coco/coco_val_openvocab_80.json                  # open-vocab dataset json (scripts/prepare_coco.py)
  coco_gt: data/coco/annotations/instances_val2017.json       # COCO annotations (for mAP)
  predictions: runs/coco/predictions                          # seed{K}/predictions.json
  features: runs/coco/features                                # seed{K}/shard*.pt

generate:
  temperature: 0.7

score:
  agg: max

band: [8, 21]                                      # middle-layer band (null = all layers)
