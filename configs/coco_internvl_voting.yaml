# COCO detection with InternVL3.5-8B  (N=16 self-consistency voting, the headline result).
# Reproduces: detection mAP 41.9 at N=16 (single-rollout is 36.2; see coco_internvl.yaml).
# n_rollouts drives everything — generate/extract produce seeds 0..15, score votes over them:
#   python run.py --config configs/coco_internvl_voting.yaml --stage generate   # writes seed0..15/
#   python run.py --config configs/coco_internvl_voting.yaml --stage extract
#   python run.py --config configs/coco_internvl_voting.yaml --stage score
model: internvl
dataset: coco

paths:
  data: data/coco/coco_val_openvocab_80.json                  # open-vocab dataset json (scripts/prepare_coco.py)
  coco_gt: data/coco/annotations/instances_val2017.json       # COCO annotations (for mAP)
  predictions: runs/coco/predictions                          # seed{K}/predictions.json
  features: runs/coco/features                                # seed{K}/shard*.pt

n_rollouts: 16                                     # 16 stochastic rollouts: produce + vote over seeds 0..15

generate:
  gpus: null                                       # null = all visible GPUs
  temperature: 0.7

extract:
  gpus: null
  n_items: 5000

score:
  agg: sum                                          # COCO headline: sum-of-cluster fusion

band: [8, 21]
