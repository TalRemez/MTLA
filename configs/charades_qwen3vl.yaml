# Charades-STA single-span temporal grounding with Qwen3-VL-8B  (single rollout).
# Single-rollout R@1@0.5 ~44; the headline R@1@0.3 76.3 / R@1@0.5 55.4 / R@1@0.7 29.4 comes
# from N=16 self-consistency selection (set seeds: [0..15] and score.n_rollouts: 16).
model: qwen3vl
dataset: charades

paths:
  data: /path/to/charades_sta_test.parquet         # Charades-STA test split
  video_dir: /path/to/Charades_v1_480              # {video_id}.mp4 clips
  predictions: runs/charades/predictions
  features: runs/charades/features                  # seed{K}/shard*.pt

generate:
  engine: hf
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  temperature: 0.7
  seeds: [0]                                        # one rollout; e.g. [0,1,...,15] for N=16 voting
  # video sampling (fps=2.0, max_pixels=128*32*32) is a dataset property: CharadesDataset.video

extract:
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  seeds: [0]                                        # video fuses generate+extract; match seeds

score:
  n_rollouts: 1                                     # single rollout (set 16 to vote over seed 0..15)
  agg: max                                          # single-span: max-MTLA selection

band: [8, 21]
