# Charades-STA single-span temporal grounding with Qwen3-VL-8B  (single rollout).
# Single-rollout R@1@0.5 ~44; the headline R@1@0.3 76.3 / R@1@0.5 55.4 / R@1@0.7 29.4 comes
# from N=16 self-consistency selection (set n_rollouts: 16).
model: qwen3vl
dataset: charades

paths:
  data: data/charades/charades_sta_test.parquet              # Charades-STA test split (scripts/prepare_charades.py)
  video_dir: data/charades/Charades_v1_480                   # {video_id}.mp4 clips
  predictions: runs/charades/predictions
  features: runs/charades/features                           # seed{K}/shard*.pt

n_rollouts: 1                                      # one knob: produce + vote over seeds 0..n-1 (16 for the headline)

generate:
  engine: hf
  gpus: null                                        # null = all visible GPUs
  temperature: 0.7
  # video sampling (fps=2.0, max_pixels=128*32*32) is a dataset property: CharadesDataset

extract:
  gpus: null

score:
  agg: max                                          # single-span: max-MTLA selection

band: [8, 21]
