[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mtla"
version = "0.1.0"
description = "Multi-Token Localized Attention: a training-free grounding-verification score for multimodal LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
# Scoring + visualization demo (CPU only, no model weights needed).
demo = [
    "torch>=2.1",
    "matplotlib>=3.6",
    "scipy>=1.10",
    "pillow>=9.0",
]
# COCO detection evaluation.
coco = ["pycocotools>=2.0"]
# Full reproduction (model inference + attention extraction) needs a GPU; pin versions
# in examples/*/README.md. Listed here for completeness, not installed by default.
extract = [
    "torch>=2.1",
    "transformers>=4.57",
]

[tool.setuptools]
packages = ["mtla"]
