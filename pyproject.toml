[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mtla"
version = "0.1.0"
description = "Multi-Token Localized Attention: a training-free grounding-verification score for multimodal LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "pandas>=2.0",        # Charades adapter reads/scores its parquet split
    "pyarrow>=14.0",      # parquet engine for pandas.read_parquet (Charades)
]

[project.optional-dependencies]
# Scoring + visualization demo (CPU only, no model weights needed).
demo = [
    "torch>=2.1",
    "matplotlib>=3.6",
    "scipy>=1.10",
    "pillow>=9.0",
]
# COCO detection evaluation.
coco = ["pycocotools>=2.0"]
# Attention extraction (the extract stage): HF eager-attention forward pass on a GPU.
# Pinned to the versions the pipeline was validated with. `decord`/`qwen-vl-utils` are only
# needed for the video (Qwen3-VL) benchmarks.
extract = [
    "torch>=2.1",
    "transformers==4.57.6",
    "accelerate==1.13.0",
    "torchvision==0.25.0",
    "timm>=1.0",            # InternVL's InternViT vision encoder (trust_remote_code)
    "qwen-vl-utils==0.0.14",
    "decord>=0.6.0",
]
# Fast batched generation for the COCO generate stage (no attention). GPU only; large install.
generate = [
    "vllm==0.19.0",
]

[tool.setuptools]
packages = ["mtla", "mtla.models", "mtla.data", "mtla.stages"]
py-modules = ["run"]
