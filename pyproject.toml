[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mtla"
version = "0.1.0"
description = "Multi-Token Localized Attention: a training-free grounding-verification score for multimodal LLMs"
readme = "README.md"
requires-python = ">=3.10"
# The library imports its full stack at import time (no lazy imports): the extract stage runs an
# HF eager-attention forward, the score stage loads .pt shards + evaluates with pycocotools/
# sklearn, and adapter discovery imports every adapter. Pinned to the validated versions.
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "pandas>=2.0",              # Charades adapter reads its parquet split
    "pyarrow>=14.0",            # parquet engine for pandas.read_parquet
    "pycocotools>=2.0",         # COCO detection mAP
    "torch>=2.1",
    "transformers==4.57.6",
    "accelerate==1.13.0",
    "torchvision==0.25.0",
    "qwen-vl-utils==0.0.14",    # Qwen3-VL vision preprocessing (image + video)
    "decord>=0.6.0",            # video frame decoding
    "pillow>=9.0",
]

[project.optional-dependencies]
# Fast batched generation (the generate stage). GPU only; large install. Imported by the stage
# subprocess (scripts/stages/), not the mtla package, so it's optional for extract/score.
generate = ["vllm==0.19.0"]
# Attention-heatmap visualization (mtla.viz, scripts/figure_pertoken.py).
viz = ["matplotlib>=3.6", "scipy>=1.10"]

[tool.setuptools]
# Only the mtla package is installable; generate.py / extract.py / score.py are repo-root
# executables (run in-place, not imported), so they are not packaged.
packages = ["mtla", "mtla.models", "mtla.data"]
